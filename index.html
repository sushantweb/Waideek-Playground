<style>
  #progress {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background-color: rgba(255, 0, 0, 0.9);
    color: white;
    font-family: 'Arial', sans-serif;
    font-size: 24px;
    font-weight: bold;
    padding: 15px 30px;
    border-radius: 10px;
    border: 2px solid white;
  }
</style>
<script>

  AFRAME.registerComponent('endless-loop', {
    tick: function () {
      let currentZ = this.el.object3D.position.z;
      if (currentZ < -15) {
        this.el.object3D.position.z += 15;
      }
      if (currentZ > 0) {
        this.el.object3D.position.z -= 15;
      }
    }
  });

  var crash = 0



  AFRAME.registerComponent('crash-detector', {
    tick: function () {
      let life = document.getElementById("life")

      if (crash == 1000) {
        alert("Game Over!")
        confirm("Want to play once again?")
        crash = 0
        life.value = 1000
      }

      let jetBox = new THREE.Box3().setFromObject(this.el.object3D);
      let hazards = document.querySelectorAll('.hazard');
      for (let i = 0; i < hazards.length; i++) {
        let hazardBox = new THREE.Box3().setFromObject(hazards[i].object3D);
        if (jetBox.intersectsBox(hazardBox)) {
          console.log("CRASH!");
          crash += 1
          var li = life.value - 1
          life.value = li
          let rig = document.querySelector('#rig');
          rig.object3D.position.set(0, 0, 0);
        }

      }
    }
  });
</script>

<body>

    <progress style="color: white;" id="life" value="1000" max="1000">&hearts;</progress>
